name: Extract ZIP File

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract ZIP file
        run: |
          # Find all ZIP files in the repository root
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting $zipfile..."
              unzip -o "$zipfile" -d .
              echo "Extraction complete for $zipfile"
            fi
          done
      
      - name: Remove ZIP files
        run: |
          rm -f *.zip
          echo "ZIP files removed"
      
      - name: Commit and push extracted files
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          message: 'chore: Extract ZIP file contents into repository'
